<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-itunes-app" content="app-id=6816400238">
<title>CarWave</title>
<link rel="icon" href="../icon.png">
<style>
  :root { --ink: #0E1122; --amber: #F5A636; --bg: #F6F6F8; --surface: #FFFFFF; --text: #14161F; --muted: #5E6272; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0B0D1A; --surface: #151935; --text: #F2F3F7; --muted: #A2A6B8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  .card { width: min(420px, calc(100% - 32px)); background: var(--surface); border-radius: 28px; padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(14,17,34,.12); text-align: center; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; margin-bottom: 20px; }
  .brand img { width: 28px; height: 28px; border-radius: 7px; }
  #art { display: none; width: 160px; height: 160px; object-fit: cover; border-radius: 24px; margin: 0 auto 16px; background: #eee; }
  #kind { color: var(--amber); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  h1 { font-size: 24px; line-height: 1.2; margin: 6px 0 4px; }
  #subtitle { color: var(--muted); margin: 0 0 20px; }
  #lead { color: var(--muted); font-size: 15px; margin: 0 0 22px; }
  .btn { display: block; padding: 14px; border-radius: 16px; font-weight: 600; text-decoration: none; margin-top: 10px; }
  #open { background: var(--amber); color: var(--ink); }
  #get { background: var(--ink); color: #fff; }
</style>
</head>
<body data-kind="p">
  <main class="card">
    <div class="brand"><img src="../icon.png" alt="">CarWave</div>
    <img id="art" alt="">
    <div id="kind"></div>
    <h1 id="title"></h1>
    <p id="subtitle"></p>
    <p id="lead"></p>
    <a id="open" class="btn" href="#"></a>
    <a id="get" class="btn" href="https://apps.apple.com/app/id6816400238"></a>
  </main>
  <script src="../share.js"></script>
</body>
</html>
